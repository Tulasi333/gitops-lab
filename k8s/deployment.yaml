apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab-app-deployment
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lab-app
  template:
    metadata:
      labels:
        app: lab-app
    spec:
      containers:
      - name: lab-app
        image: lab-app:1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: lab-app-service
  namespace: default
spec:
  selector:
    app: lab-app
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8080